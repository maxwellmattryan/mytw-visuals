<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>007-layers</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				padding: 0;
				background: #000;
				color: #ddd;
				font:
					12px/1.4 system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
			}

			.editor {
				box-sizing: border-box;
				display: grid;
				grid-template-columns: 260px minmax(0, 1fr) 300px;
				gap: 12px;
				height: 100%;
				padding: 12px;
			}

			#layers,
			#properties {
				min-height: 0;
			}

			.stage {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				min-width: 0;
				min-height: 0;
			}

			.stage canvas {
				width: 100%;
				height: 100%;
				object-fit: contain;
			}

			.stage-message {
				position: absolute;
				inset: auto 12px 12px;
				margin: 0;
				padding: 8px 10px;
				border: 1px solid #ff6b6b;
				border-radius: 4px;
				background: rgba(16, 16, 16, 0.92);
				color: #ff6b6b;
				white-space: pre-wrap;
			}

			.stage-message:empty {
				display: none;
			}
		</style>
	</head>
	<body>
		<main class="editor">
			<div id="layers"></div>
			<div class="stage" id="stage">
				<canvas id="canvas" aria-label="Preview"></canvas>
				<p class="stage-message" id="stage-message" role="status"></p>
			</div>
			<div id="properties"></div>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
