<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>006-export-check</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: #000;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100vw;
				height: 100vh;
			}
			canvas {
				display: block;
				max-width: 100vw;
				max-height: 100vh;
			}
			#panel {
				position: fixed;
				top: 8px;
				left: 8px;
				display: grid;
				grid-template-columns: auto auto;
				gap: 4px 8px;
				align-items: center;
				max-width: min(420px, calc(100vw - 32px));
				padding: 8px;
				font:
					12px/1.4 ui-monospace,
					monospace;
				color: #fff;
				background: rgba(0, 0, 0, 0.7);
			}
			#panel input,
			#panel select,
			#panel button {
				font: inherit;
				color: #fff;
				background: #111;
				border: 1px solid #555;
				padding: 2px 4px;
			}
			#panel input {
				width: 8ch;
			}
			#panel button:disabled {
				color: #666;
				border-color: #333;
			}
			#panel .wide {
				grid-column: 1 / -1;
			}
			#panel .buttons {
				display: flex;
				flex-wrap: wrap;
				gap: 4px;
			}
			#panel output {
				white-space: pre-wrap;
			}
			#status {
				color: #f88;
			}
			#warnings {
				color: #fc6;
			}
		</style>
	</head>
	<body>
		<div id="panel">
			<label for="preset">preset</label>
			<select id="preset">
				<option value="spotifyCanvas">Spotify Canvas</option>
				<option value="instagramReel">Instagram Reel</option>
				<option value="custom">Custom</option>
			</select>
			<label for="width">width</label>
			<input id="width" type="number" min="2" step="2" />
			<label for="height">height</label>
			<input id="height" type="number" min="2" step="2" />
			<label for="fps">fps</label>
			<input id="fps" type="number" min="1" max="240" step="any" />
			<label for="frames">frames</label>
			<input id="frames" type="number" min="1" step="1" value="225" />
			<label for="quality">quality</label>
			<select id="quality">
				<option value="low">low</option>
				<option value="medium">medium</option>
				<option value="high">high</option>
				<option value="very-high">very-high</option>
			</select>
			<div class="wide buttons">
				<button id="export-mp4" type="button">Export MP4</button>
				<button id="export-png" type="button">Export PNG sequence</button>
				<button id="export-still" type="button">Export still</button>
				<button id="cancel" type="button" disabled>Cancel</button>
			</div>
			<output id="progress" class="wide"></output>
			<output id="warnings" class="wide"></output>
			<output id="status" class="wide" role="status"></output>
		</div>
		<script type="module" src="./sketch.ts"></script>
	</body>
</html>
